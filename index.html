<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolatier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="palais">
            <img class="logo" src="assets/image.png" alt="logo">
            <h1>Palais du Chocolat</h1>
        </div>
        <div class="chocolat">
            <p>Le chocolat qui éveille vos papilles</p>
            <p>Devis gratuit</p>
        </div>
    </header>
    <main>
        <section>
            <div class="cacao">
                <img src="assets/cacaopoudre.png" alt="photo">
                <img src="assets/cacaograin.png" alt="photo">
                <img src="assets/fevecacao.png" alt="photo">
            </div>
            <div class="catalogue">
                <a href="">Voir le catalogue</a>
            </div>
        </section>
    </main>

</body>

</html>
